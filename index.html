<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopEasy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="authScreen" class="auth">
    <div class="auth-card">
      <h1>ShopEasy</h1>
      <div class="tabs">
        <button type="button" id="tabLogin" class="tab active">Log in</button>
        <button type="button" id="tabSignup" class="tab">Sign up</button>
      </div>
      <form id="authForm" novalidate>
        <label id="nameRow" hidden>Full name <input id="name" autocomplete="name"></label>
        <label>Email <input id="email" type="email" autocomplete="email"></label>
        <label>Password <input id="password" type="password" autocomplete="current-password"></label>
        <label id="confirmRow" hidden>Confirm password <input id="confirm" type="password" autocomplete="new-password"></label>
        <label class="check"><input id="showPw" type="checkbox"> Show password</label>
        <p id="authError" class="error" role="alert"></p>
        <button id="authSubmit" class="primary full" type="submit">Log in</button>
      </form>
    </div>
  </section>

  <div id="appRoot" hidden>
    <header>
      <h1>ShopEasy</h1>
      <input id="search" type="search" placeholder="Search products">
      <button id="cartBtn">Cart (<span id="cartCount">0</span>)</button>
      <button id="authBtn">Log out</button>
    </header>

    <main>
      <div class="bar">
        <select id="category" aria-label="Category"></select>
        <button id="addBtn" class="primary">Add product</button>
      </div>
      <div id="grid" class="grid"></div>
      <p id="empty" hidden>No products match. Try a different search.</p>
    </main>
  </div>

  <dialog id="productDlg">
    <form method="dialog" id="productForm">
      <h2 id="productTitle">Add product</h2>
      <label>Name <input id="pName" required></label>
      <label>Price (USD) <input id="pPrice" type="number" min="0" step="0.01" required></label>
      <label>Category <input id="pCat" required></label>
      <label>Emoji <input id="pEmoji" maxlength="2" value="🛍️"></label>
      <div class="row"><button value="cancel" formnovalidate>Cancel</button><button class="primary" value="ok">Save</button></div>
    </form>
  </dialog>

  <dialog id="cartDlg">
    <h2>Your cart</h2>
    <div id="cartItems"></div>
    <p><strong>Total: <span id="cartTotal">$0.00</span></strong></p>
    <div class="row"><button id="clearCart">Clear cart</button><button id="closeCart" class="primary">Close</button></div>
  </dialog>

  <div id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
                       </html>
